# Guardrail local resolver (dnsmasq drop-in).
#
# Listens on loopback only. Blocked domains are answered locally with
# `address=/<domain>/0.0.0.0` (guardrail-block.conf, generated by focus.sh).
# Unlike /etc/hosts that syntax maps the domain *and every subdomain*, so
# subdomains are covered without listing each one.
#
# Everything else is forwarded to the real upstream DNS, written by
# `guardrail-upstream` to guardrail-upstream.conf and refreshed on every
# NetworkManager change. It is deliberately NOT systemd-resolved's stub
# (127.0.0.53): /etc/resolv.conf points at this resolver, so forwarding to
# resolved — which imports 127.0.0.1 from /etc/resolv.conf as its own upstream
# — would make the two forward to each other in an endless loop.
#
# /etc/resolv.conf is pointed at 127.0.0.1 so all local clients use this
# resolver.

listen-address=127.0.0.1
interface=lo
bind-interfaces

# Never read /etc/resolv.conf; upstream comes from guardrail-upstream.conf.
no-resolv
no-poll
cache-size=1000
